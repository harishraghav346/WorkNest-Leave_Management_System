spring.application.name=SpringBootEmp

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Configuration (Persistent H2 by default for zero-setup execution; MySQL override supported via DB_URL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/leavetracker;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT Security
jwt.secret=hrleavetrackersupersafesecretkeyforhmacsha256tokenshrleaveapp2025
jwt.expiration=86400000

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:5173,https://8081-ffaacedbbcdccdbcbeeaefdcadcfebaceabaa.premiumproject.examly.io}