spring.application.name=SpringBootEmp

# Default active profile (dev by default; override with SPRING_PROFILES_ACTIVE=prod in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate (ddl-auto=update safely preserves all existing tables and data, adds new tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Configuration (Persistent H2 by default)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/leavetracker;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (defaults)
spring.h2.console.path=/h2-console

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT Expiration default (24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:5173,https://8081-ffaacedbbcdccdbcbeeaefdcadcfebaceabaa.premiumproject.examly.io}

# Development account seeding (strictly disabled by default; enabled only in dev profile)
app.bootstrap.dev-accounts=${APP_BOOTSTRAP_DEV_ACCOUNTS:false}

# Jackson serialization configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Invitation dev token delivery (strictly disabled by default in all profiles)
app.invitation.dev-token-delivery=${APP_INVITATION_DEV_TOKEN_DELIVERY:false}

# Trusted reverse proxies for client IP extraction (comma-separated, empty by default)
app.security.trusted-proxies=${APP_SECURITY_TRUSTED_PROXIES:}

# Public Application Base URL (for activation and verification links)
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Transactional Mail Configuration (safe defaults; real emails sent only when SMTP_HOST is configured)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@worknest.io}
app.mail.from-name=${MAIL_FROM_NAME:WorkNest}