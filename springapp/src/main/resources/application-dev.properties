# WorkNest Development Profile
# Explicit development secret (>= 32 bytes) used only in dev when JWT_SECRET env var is not set
jwt.secret=${JWT_SECRET:worknest-dev-environment-only-hmac-sha256-secret-key-32bytes-min}
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
app.bootstrap.dev-accounts=true
